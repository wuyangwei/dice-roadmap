# Sealos 部署配置文件
name: dice-roadmap
labels:
  app: dice-roadmap

# 后端服务配置
services:
  backend:
    image: node:20-alpine
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - JWT_SECRET=your-secret-key-here-change-in-production
      - OPERATOR_PIN=123456
      - ADMIN_PIN=888888
      - DATA_DIR=/var/data
    volumes:
      - data:/var/data
    restart: always

# 数据卷持久化
volumes:
  data:
