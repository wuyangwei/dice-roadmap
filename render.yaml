# render.yaml - Render 部署配置
# 免费额度：750 小时/月，100GB 流量/月
# 国内访问速度一般，但完全免费！

services:
  - type: web
    name: dice-roadmap
    env: docker
    plan: free
    region: singapore  # 新加坡节点，国内访问更快
    dockerfilePath: Dockerfile
    dockerContext: .
    # 健康检查配置
    healthCheckPath: /api/health
    healthCheckInterval: 30
    healthCheckTimeout: 3
    healthCheckGracePeriod: 40
    # 自动部署配置
    autoDeploy: true
    # 环境变量
    envVars:
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: OPERATOR_PIN
        value: 123456
      - key: ADMIN_PIN
        value: 888888
    # 持久化磁盘配置（重要！否则重启数据会丢失）
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
