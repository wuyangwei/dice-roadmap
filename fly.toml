# fly.toml - Fly.io 部署配置
# 免费额度：1个共享 CPU 实例，1GB 存储，160GB 流量/月
# 国内访问速度一般，但完全免费！

app = "dice-roadmap"
primary_region = "hkg"  # 香港节点，国内访问更快

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  DATA_DIR = "/data"

[[services]]
  internal_port = 3001
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    restart_limit = 6
    timeout = "2s"

[mounts]
  source = "roadmap_data"
  destination = "/data"
  initial_size = "1gb"
